name: Temporary Crimson Max Inventory TEST4 Build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW x64
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: Build TEST4 loader probe
        run: |
          x86_64-w64-mingw32-gcc -shared -Os -s -ffreestanding -fno-builtin -fno-stack-protector -nostdlib -DPROBE_ONLY=1 \
            -Wl,--entry=DllMain -Wl,--subsystem,windows \
            -o CrimsonMaxInventory1561_TEST4_LOADER_PROBE.asi tmp_crimson_build/CrimsonMaxInventory1561.c -lkernel32
      - name: Build TEST4
        run: |
          x86_64-w64-mingw32-gcc -shared -Os -s -ffreestanding -fno-builtin -fno-stack-protector -nostdlib \
            -Wl,--entry=DllMain -Wl,--subsystem,windows \
            -o CrimsonMaxInventory1561_CD2.01.00_TEST4.asi tmp_crimson_build/CrimsonMaxInventory1561.c -lkernel32
      - name: Audit PE and imports
        run: |
          file CrimsonMaxInventory1561_TEST4_LOADER_PROBE.asi
          file CrimsonMaxInventory1561_CD2.01.00_TEST4.asi
          x86_64-w64-mingw32-objdump -p CrimsonMaxInventory1561_TEST4_LOADER_PROBE.asi > probe_pe.txt
          x86_64-w64-mingw32-objdump -p CrimsonMaxInventory1561_CD2.01.00_TEST4.asi > test4_pe.txt
          echo '--- PROBE DLL NAMES ---'
          grep 'DLL Name:' probe_pe.txt || true
          echo '--- TEST4 DLL NAMES ---'
          grep 'DLL Name:' test4_pe.txt || true
          if grep -qiE 'msvcrt|ucrt|vcruntime|libgcc|libwinpthread' probe_pe.txt test4_pe.txt; then
            echo 'Unexpected CRT/runtime import found'
            exit 1
          fi
          sha256sum CrimsonMaxInventory1561_TEST4_LOADER_PROBE.asi CrimsonMaxInventory1561_CD2.01.00_TEST4.asi | tee SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: CrimsonMaxInventory1561-CD2.01.00-TEST4
          if-no-files-found: error
          path: |
            CrimsonMaxInventory1561_TEST4_LOADER_PROBE.asi
            CrimsonMaxInventory1561_CD2.01.00_TEST4.asi
            SHA256SUMS.txt
            probe_pe.txt
            test4_pe.txt
            tmp_crimson_build/CrimsonMaxInventory1561.c
