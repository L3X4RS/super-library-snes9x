name: Temporary Crimson Max Inventory Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW x64
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: Build logged ASI
        run: |
          x86_64-w64-mingw32-gcc -shared -O2 -s -o CrimsonMaxInventory1561_CD2.01.00_TEST2_LOGGED.asi tmp_crimson_build/CrimsonMaxInventory1561.c -static-libgcc
      - name: Build no-log ASI
        run: |
          x86_64-w64-mingw32-gcc -shared -O2 -s -DNO_LOG=1 -o CrimsonMaxInventory1561_CD2.01.00_TEST2.asi tmp_crimson_build/CrimsonMaxInventory1561.c -static-libgcc
      - name: Audit and hashes
        run: |
          file CrimsonMaxInventory1561_CD2.01.00_TEST2_LOGGED.asi
          x86_64-w64-mingw32-objdump -p CrimsonMaxInventory1561_CD2.01.00_TEST2_LOGGED.asi | head -n 120
          sha256sum CrimsonMaxInventory1561_CD2.01.00_TEST2_LOGGED.asi CrimsonMaxInventory1561_CD2.01.00_TEST2.asi | tee SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: CrimsonMaxInventory1561-CD2.01.00-TEST2
          if-no-files-found: error
          path: |
            CrimsonMaxInventory1561_CD2.01.00_TEST2_LOGGED.asi
            CrimsonMaxInventory1561_CD2.01.00_TEST2.asi
            SHA256SUMS.txt
            tmp_crimson_build/CrimsonMaxInventory1561.c
